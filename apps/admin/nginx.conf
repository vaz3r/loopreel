server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver for dynamic upstream resolution.
    # Without this, nginx caches the IP of "api" at startup and never re-resolves,
    # causing 502s after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|gif|jpe?g|png|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
