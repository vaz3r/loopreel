<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fine Print — Wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0A0C; --ink:#F5F5F7; --red:#FF2A2A; --mono:#858592; --s:1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#050506; }
  body { display:grid; place-items:center; min-height:100vh; overflow:hidden; }
  .stage { width:calc(1080px*var(--s)); height:calc(1080px*var(--s)); position:relative; }

  #canvas { position:absolute; top:0; left:0; width:1080px; height:1080px; transform:scale(var(--s)); transform-origin:0 0;
            background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; }

  /* ===== Wordmark ===== */
  .mark { display:flex; flex-direction:column; align-items:flex-start; transform:translateX(12px); }
  .word { font-family:"Space Grotesk",sans-serif; font-weight:800; color:var(--ink);
          font-size:168px; line-height:.86; letter-spacing:-0.045em; text-transform:uppercase; }
  .ast  { color:var(--red); font-size:.62em; vertical-align:top; position:relative; top:-0.02em; margin-left:.04em; }
  .foot { margin-top:34px; font-family:"JetBrains Mono",monospace; font-weight:500; font-size:20px;
          letter-spacing:.25em; color:var(--mono); text-transform:uppercase; }
  .foot b { color:var(--red); font-weight:700; }

  /* ===== Crop mask ===== */
  .mask { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .24s;
          background:radial-gradient(circle at 50% 50%, transparent 410px, rgba(0,0,0,.5) 410.75px); }
  .mask::before { content:""; position:absolute; left:50%; top:50%; width:820px; height:820px; transform:translate(-50%,-50%);
                  border-radius:50%; border:1.5px dashed var(--red); }
  #canvas.on .mask { opacity:1; }
  .toggle { position:fixed; top:20px; right:20px; z-index:10; padding:10px 16px; border-radius:999px; cursor:pointer;
            font:700 12px/1 "JetBrains Mono",monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--ink);
            background:rgba(20,20,24,.55); border:1px solid rgba(133,133,146,.35);
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); opacity:.75; }
  .toggle:hover, .toggle[aria-pressed="true"] { opacity:1; }
  .toggle[aria-pressed="true"] { border-color:var(--red); color:var(--red); }
  .toggle:focus-visible { outline:2px solid var(--red); outline-offset:3px; }
</style>
</head>
<body>
<button class="toggle" id="t" type="button" aria-pressed="false">IG Crop Mask</button>

<main class="stage">
  <div id="canvas" role="img" aria-label="The Fine Print wordmark with a red asterisk">
    <div class="mark">
      <span class="word">The</span>
      <span class="word">Fine</span>
      <span class="word">Print<span class="ast">*</span></span>
      <span class="foot"><b>*</b>Read it.</span>
    </div>
    <div class="mask" aria-hidden="true"></div>
  </div>
</main>

<script>
(function(){
  var c=document.getElementById("canvas"), b=document.getElementById("t");
  function fit(){ var s=Math.min(1,(innerWidth-48)/1080,(innerHeight-48)/1080);
    document.documentElement.style.setProperty("--s",Math.max(.1,s).toFixed(4)); }
  b.addEventListener("click",function(){ var on=c.classList.toggle("on"); b.setAttribute("aria-pressed",String(on)); });
  addEventListener("resize",fit); fit();
})();
</script>
</body>
</html>
