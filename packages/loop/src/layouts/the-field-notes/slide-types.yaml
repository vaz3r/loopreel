# The Field Notes - inherits shared types + defines authentic researcher notebook types
inherits:
  - cover
  - cta
  - sequence
  - telemetry
  - quote

types:
  statement:
    name: Statement Slide
    description: "Oversized bold field claim, observation, or core insight"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Bold observation headline"
        example: "The Research Paradox"
      - name: text
        type: string
        required: true
        maxLength: 350
        description: "Substantive observation body text (20-40 words)"
        example: "Designers routinely abandon formal methodology in practice, yet systematic inquiry remains the cornerstone of breakthrough innovation."
      - name: scribble
        type: string
        required: false
        maxLength: 80
        description: "Handwritten margin note with arrow"
        example: "observed across 12 field interviews"
      - name: note
        type: string
        required: false
        maxLength: 120
        description: "Footnote annotation at bottom"
        example: "* Verified during longitudinal design audits (1960–2020)."
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "FIELD OBSERVATION"
    headlinePatterns:
      - id: fn-stmt-paradox
        name: "The Paradox"
        template: "The [Subject] Paradox"
        example: "The Research Paradox"
        emotionalTrigger: curiosity
        bestFor: "Challenging conventional beliefs"
    rules:
      - "MUST provide a substantive `text` paragraph (at least 20 words) — never leave the slide body blank"
      - "Include a handwritten `scribble` margin note when the brief has qualitative color"
    powerWords:
      - observed
      - paradox
      - reality
      - hidden
      - practice
    hasHeadline: true

  specimen:
    name: Specimen Slide
    description: "Definition card pinned with washi tape for a key term, concept, or paradigm"
    category: narrative
    fields:
      - name: term
        type: string
        required: true
        maxLength: 60
        description: "Term, concept, or methodology being defined"
        example: "Designerly Ways of Knowing"
      - name: pos
        type: string
        required: false
        maxLength: 50
        description: "Part of speech or category classification"
        example: "epistemology · design inquiry"
      - name: pron
        type: string
        required: false
        maxLength: 60
        description: "Pronunciation or origin guide"
        example: "/dɪˈzaɪn.ər.li weɪz/"
      - name: definition
        type: string
        required: true
        maxLength: 400
        description: "Comprehensive plain-language definition and significance (20-50 words)"
        example: "A distinct form of cognitive enquiry and problem-solving inherent to design practice, separate from both traditional scientific inquiry and scholarly humanities."
      - name: found
        type: string
        required: false
        maxLength: 80
        description: "Handwritten 'Found in' origin note"
        example: "Royal College of Art, 1979"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "SPECIMEN"
    headlinePatterns: []
    rules:
      - "MUST specify `term` and a thorough `definition`"
      - "Use `pos` to classify the concept's domain"
      - "Provide authentic `found` origin when available in the brief"
    powerWords:
      - paradigm
      - inquiry
      - methodology
      - epistemology
    hasHeadline: false

  measure:
    name: Measure Slide
    description: "Massive statistic with tickmark ruler and qualitative impact note"
    category: data
    fields:
      - name: value
        type: string
        required: true
        maxLength: 20
        description: "Massive stat value"
        example: "60"
      - name: unit
        type: string
        required: false
        maxLength: 20
        description: "Handwritten unit or denominator"
        example: "years"
      - name: label
        type: string
        required: false
        maxLength: 60
        description: "Ruler calibration label"
        example: "Evolutionary Timeline"
      - name: headline
        type: string
        required: true
        maxLength: 90
        description: "Headline explaining the metric"
        example: "Six Decades of Methodological Evolution"
      - name: text
        type: string
        required: true
        maxLength: 300
        description: "Analytical context explaining what this number proves (15-30 words)"
        example: "Since the 1960s Conference on Design Methods, the discipline has transformed from rigid engineering algorithms into human-centered reflective practice."
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "MEASUREMENT"
    headlinePatterns:
      - id: fn-measure-stat
        name: "Metric Impact"
        template: "[Number] [Unit]: [Impact]"
        example: "60 Years: From Rigid Rules to Human Empathy"
        emotionalTrigger: data
        bestFor: "Highlighting key timelines or percentages"
    rules:
      - "MUST include `value`, `headline`, and substantive `text`"
      - "Never invent numbers — stat must come directly from the brief"
    powerWords:
      - shift
      - decades
      - measured
      - surge
      - transformed
    hasHeadline: true

  tally:
    name: Tally Slide
    description: "Survey readings and quantitative multi-metric field grid"
    category: data
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 90
        description: "Headline framing the dataset"
        example: "Key Benchmarks in Design History"
      - name: items
        type: array
        required: true
        description: "2 to 4 data metrics"
      - name: items[].value
        type: string
        required: true
        maxLength: 20
        description: "Stat value"
        example: "1962"
      - name: items[].unit
        type: string
        required: false
        maxLength: 15
        description: "Unit"
        example: "London"
      - name: items[].label
        type: string
        required: true
        maxLength: 60
        description: "Label above metric"
        example: "Methods Conference"
      - name: items[].desc
        type: string
        required: true
        maxLength: 180
        description: "Contextual narrative sentence (10-20 words)"
        example: "Marked the formal launch of design methods movement and computational design study."
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "FIELD TALLY"
    headlinePatterns:
      - id: fn-tally-breakdown
        name: "Data Breakdown"
        template: "[Topic] By The Numbers"
        example: "Design Research By The Numbers"
        emotionalTrigger: data
        bestFor: "Multiple quantitative milestones"
    rules:
      - "MUST have 2 to 4 distinct `items` — each with `value`, `label`, and `desc`"
      - "Never omit item descriptions"
    powerWords:
      - benchmark
      - survey
      - recorded
      - distribution
    hasHeadline: true

  compare:
    name: Compare Slide
    description: "Two-column comparison card contrasting two paradigms, philosophies, or time periods"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 90
        description: "Headline framing the contrast"
        example: "Science of Design vs. Reflective Practice"
      - name: left
        type: object
        required: true
        description: "Left side comparison"
      - name: left.label
        type: string
        required: true
        maxLength: 40
        description: "Left column label"
        example: "Herbert Simon (1969)"
      - name: left.items
        type: array
        required: true
        description: "1 to 4 bullet points"
      - name: right
        type: object
        required: true
        description: "Right side comparison"
      - name: right.label
        type: string
        required: true
        maxLength: 40
        description: "Right column label"
        example: "Donald Schön (1983)"
      - name: right.items
        type: array
        required: true
        description: "1 to 4 bullet points"
      - name: scribble
        type: string
        required: false
        maxLength: 80
        description: "Margin annotation"
        example: "the epistemological debate"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "COMPARISON"
    headlinePatterns:
      - id: fn-compare-vs
        name: "Dichotomy vs"
        template: "[Entity A] vs. [Entity B]: [Tension]"
        example: "Rigid Science vs. Reflective Practice"
        emotionalTrigger: challenge
        bestFor: "Debates, historical shifts, opposing paradigms"
    rules:
      - "MUST include both `left` and `right` objects with `label` and `items`"
      - "Each side must contain 1 to 3 substantive comparative points"
    powerWords:
      - versus
      - divide
      - contrast
      - shift
      - conflict
    hasHeadline: true

  entry:
    name: Entry Slide
    description: "Reflective field journal entry with illuminated drop cap typography"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Journal entry title"
        example: "The Epistemological Turning Point"
      - name: date
        type: string
        required: false
        maxLength: 40
        description: "Handwritten date or era"
        example: "RCA London, 1979"
      - name: text
        type: string
        required: true
        maxLength: 650
        description: "Substantive reflective paragraph (40-80 words). First letter rendered as oversized drop cap."
        example: "Designing is neither natural science nor fine art. When Bruce Archer declared that designers possess an autonomous way of knowing, he decoupled the discipline from borrowed computer algorithms and established design research as an authentic academic inquiry in its own right."
      - name: scribble
        type: string
        required: false
        maxLength: 80
        description: "Handwritten margin note"
        example: "seminal turning point"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "JOURNAL ENTRY"
    headlinePatterns:
      - id: fn-entry-reflection
        name: "Reflective Entry"
        template: "On [Concept]: [Core Insight]"
        example: "On Design Knowing: The Epistemological Turn"
        emotionalTrigger: curiosity
        bestFor: "Deep philosophical or historical takeaways"
    rules:
      - "MUST provide a rich paragraph in `text` (40-80 words) — drop cap requires length to look balanced"
      - "Do NOT write short fragments"
    powerWords:
      - revealed
      - discovered
      - decoupled
      - autonomous
      - fundamental
    hasHeadline: true

  route:
    name: Route Slide
    description: "Step-by-step route or methodological progression with circled numbers"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Route headline"
        example: "The Five Stages of Research Inquiry"
      - name: items
        type: array
        required: true
        description: "2 to 5 waypoints"
      - name: items[].title
        type: string
        required: true
        maxLength: 60
        description: "Waypoint title"
        example: "Exploratory Framing"
      - name: items[].desc
        type: string
        required: true
        maxLength: 180
        description: "Waypoint description (10-20 words)"
        example: "Immerse in contextual field observation to unearth unspoken participant frictions."
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "METHOD ROUTE"
    headlinePatterns:
      - id: fn-route-stages
        name: "Progressive Route"
        template: "[Number] Stages to [Outcome]"
        example: "4 Phases in Modern Design Research"
        emotionalTrigger: curiosity
        bestFor: "Sequential methodologies and roadmaps"
    rules:
      - "MUST include 2 to 5 `items` with both `title` and `desc`"
      - "Never leave items empty"
    powerWords:
      - route
      - journey
      - milestone
      - progress
    hasHeadline: true

  log:
    name: Log Slide
    description: "Timestamped chronological log of field observations"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Log title"
        example: "Chronological Field Timeline"
      - name: items
        type: array
        required: true
        description: "2 to 4 log entries"
      - name: items[].time
        type: string
        required: true
        maxLength: 30
        description: "Timestamp or decade"
        example: "1960s"
      - name: items[].title
        type: string
        required: true
        maxLength: 60
        description: "Event or milestone"
        example: "Design Methods Movement"
      - name: items[].desc
        type: string
        required: true
        maxLength: 180
        description: "Milestone detail (10-20 words)"
        example: "Pioneered systematic problem-solving borrowed from computer architecture."
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "FIELD LOG"
    headlinePatterns: []
    rules:
      - "MUST include 2 to 4 `items` with `time`, `title`, and `desc`"
    powerWords:
      - recorded
      - observed
      - documented
    hasHeadline: true

  table:
    name: Table Slide
    description: "Tabular field survey comparing criteria across paradigms"
    category: data
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Survey table headline"
        example: "Three Paradigms of Inquiry"
      - name: columns
        type: array
        required: true
        description: "2 to 3 column headers"
      - name: rows
        type: array
        required: true
        description: "2 to 4 survey rows with values"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "SURVEY TABLE"
    headlinePatterns: []
    rules:
      - "MUST define structured columns and rows"
    powerWords:
      - survey
      - matrix
      - taxonomy
    hasHeadline: true

  chart:
    name: Chart Slide
    description: "Hand-drawn comparison bar chart with data labels"
    category: data
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Chart headline"
        example: "Adoption Across Disciplines"
      - name: bars
        type: array
        required: true
        description: "2 to 4 data bars with label and value"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "READINGS"
    headlinePatterns: []
    rules:
      - "MUST define 2 to 4 data bars"
    powerWords:
      - metric
      - share
      - growth
    hasHeadline: true

  map:
    name: Map Slide
    description: "Spatial or thematic coordinate map with compass rose"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Map title"
        example: "Field Mapping"
      - name: points
        type: array
        required: true
        description: "2 to 4 spatial/thematic coordinates"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "TERRAIN MAP"
    headlinePatterns: []
    rules:
      - "MUST include 2 to 4 mapped points"
    powerWords:
      - coordinates
      - terrain
      - territory
    hasHeadline: true

  qa:
    name: QA Slide
    description: "Field interrogation or core interview question and answer"
    category: narrative
    fields:
      - name: question
        type: string
        required: true
        maxLength: 140
        description: "Key research question"
        example: "Can Design Truly Be Separated From Science?"
      - name: answer
        type: string
        required: true
        maxLength: 400
        description: "Substantive evidence-based answer (25-50 words)"
        example: "Yes. While science examines what already exists through empirical testing, design synthesizes what ought to be through iterative conjecture and reflective framing."
      - name: by
        type: string
        required: false
        maxLength: 60
        description: "Attribution or researcher"
        example: "Nigel Cross"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "FIELD INQUIRY"
    headlinePatterns: []
    rules:
      - "MUST include both `question` and substantive `answer`"
    powerWords:
      - synthesis
      - inquiry
      - conjecture
    hasHeadline: false

  kit:
    name: Kit Slide
    description: "Checklist of field principles, tools, or heuristics"
    category: narrative
    fields:
      - name: headline
        type: string
        required: true
        maxLength: 80
        description: "Checklist title"
        example: "The Researcher's Diagnostic Checklist"
      - name: items
        type: array
        required: true
        description: "3 to 6 checklist items"
      - name: items[].text
        type: string
        required: true
        maxLength: 140
        description: "Checklist item text"
        example: "Distinguish between design science and design research"
      - name: items[].state
        type: string
        required: false
        description: "'done', 'open', or 'flag'"
        example: "done"
      - name: tag
        type: string
        required: false
        maxLength: 30
        description: "Header category tag"
        example: "KIT LIST"
    headlinePatterns: []
    rules:
      - "MUST include 3 to 6 checklist items"
    powerWords:
      - diagnostic
      - verification
      - inventory
    hasHeadline: true
